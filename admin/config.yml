# comertali.com — Decap CMS yapılandırması
#
# Giriş yöntemi: doğrudan GitHub OAuth (Netlify'ın site kendisinde barındığı
# için otomatik sağladığı OAuth sağlayıcısı ile, ekstra kurulum gerekmez).
# /admin sayfasında "Login with GitHub" ile reponuza (alicomert1903/www.comertali.com)
# yazma izni olan GitHub hesabınızla giriş yapılır. Repo private kalabilir;
# Identity/Git Gateway'e ihtiyaç yoktur.

backend:
  name: github
  repo: alicomert1903/www.comertali.com
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "portfoy"
    label: "Özel Portföy Kartları"
    description: "Ana sayfadaki 3 'Özel Portföy' kartının içeriği. Kaydettiğinizde site otomatik yeniden yayınlanır."
    files:
      - file: "content/portfolio.json"
        label: "3 Portföy Kartı"
        name: "portfolio"
        fields:
          - label: "Kartlar"
            name: "cards"
            widget: "list"
            min: 3
            max: 3
            summary: "{{title}}"
            fields:
              - { label: "Üst Etiket (ör. Çankaya · Diplomatik Kuşak)", name: "badge", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }
              - { label: "Arka Plan Görseli", name: "image", widget: "image" }
