# comertali.com — Decap CMS yapılandırması
#
# Giriş yöntemi: doğrudan GitHub OAuth (Netlify'ın site kendisinde barındığı
# için otomatik sağladığı OAuth sağlayıcısı ile, ekstra kurulum gerekmez).
# /admin sayfasında "Login with GitHub" ile reponuza (alicomert1903/www.comertali.com)
# yazma izni olan GitHub hesabınızla giriş yapılır. Repo private kalabilir;
# Identity/Git Gateway'e ihtiyaç yoktur.

backend:
  name: github
  repo: alicomert1903/www.comertali.com
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "portfoy"
    label: "Özel Portföy Kartları"
    description: "Ana sayfadaki 3 'Özel Portföy' kartının içeriği. Kaydettiğinizde site otomatik yeniden yayınlanır."
    files:
      - file: "content/portfolio.json"
        label: "3 Portföy Kartı"
        name: "portfolio"
        fields:
          - label: "Kartlar"
            name: "cards"
            widget: "list"
            min: 3
            max: 3
            summary: "{{title}}"
            fields:
              - { label: "Üst Etiket (ör. Çankaya · Diplomatik Kuşak)", name: "badge", widget: "string" }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }
              - { label: "Arka Plan Görseli", name: "image", widget: "image" }
              - { label: "Üst Etiket (EN) — opsiyonel, doldurulursa İngilizce sitede kullanılır", name: "badge_en", widget: "string", required: false }
              - { label: "Başlık (EN) — opsiyonel", name: "title_en", widget: "string", required: false }
              - { label: "Açıklama (EN) — opsiyonel", name: "description_en", widget: "text", required: false }

  - name: "videolar"
    label: "Video Galerisi"
    description: "Ana sayfadaki Video Galerisi bölümü (en yeni 6 video gösterilir). YouTube linki yapıştırırsanız kapak görseli otomatik çekilir. Instagram Reel'leri her Pazar akşamı otomatik eklenir; istemediğiniz birini buradan silebilirsiniz, tekrar eklenmez. Liste boşsa bölüm sitede görünmez."
    files:
      - file: "content/videos.json"
        label: "YouTube Videoları"
        name: "videos"
        fields:
          - label: "Videolar"
            name: "videos"
            widget: "list"
            min: 0
            summary: "{{title}}"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Video Linki (YouTube veya Instagram Reel)", name: "url", widget: "string", hint: "Örn: https://www.youtube.com/watch?v=XXXXXXXXXXX, https://youtu.be/XXXXXXXXXXX veya https://www.instagram.com/reel/XXXXXXXXXXX/" }
              - { label: "Kısa Açıklama (opsiyonel)", name: "description", widget: "text", required: false }
              - { label: "Başlık (EN) — opsiyonel, İngilizce sitede kullanılır", name: "title_en", widget: "string", required: false }
              - { label: "Açıklama (EN) — opsiyonel", name: "description_en", widget: "text", required: false }
              - { label: "Kapak Görseli (Instagram için)", name: "thumbnail", widget: "image", required: false, hint: "YouTube videolarında gerekmez; Instagram Reel'lerinde otomatik eklenir." }
              - { label: "Yayın Tarihi (sıralama için)", name: "date", widget: "datetime", required: false }

  - name: "blog"
    label: "Blog / Bölgesel Analiz"
    description: "Her yazı kaydedildiğinde site otomatik yeniden derlenir ve yazı kendi sayfasında yayınlanır (birkaç dakika sürebilir)."
    folder: "content/posts"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - label: "Kategori"
        name: "category"
        widget: "select"
        options:
          - { label: "Bölge Analizi", value: "bolge_analizi" }
          - { label: "Yatırım Rehberi", value: "yatirim_rehberi" }
          - { label: "Piyasa Raporu", value: "piyasa_raporu" }
          - { label: "Vatandaşlık", value: "vatandaslik" }
          - { label: "Genel", value: "genel" }
        default: "genel"
      - { label: "Kısa Özet (kart ve arama motoru açıklaması için)", name: "excerpt", widget: "text" }
      - { label: "Kapak Görseli", name: "cover_image", widget: "image", required: false }
      - { label: "Yayın Tarihi", name: "date", widget: "datetime" }
      - { label: "Yazı İçeriği", name: "body", widget: "markdown" }
      - { label: "Title (EN) — opsiyonel, doldurulursa en/blog/ sayfası da otomatik oluşturulur", name: "title_en", widget: "string", required: false }
      - { label: "Excerpt (EN) — opsiyonel", name: "excerpt_en", widget: "text", required: false }
      - { label: "Body (EN) — opsiyonel", name: "body_en", widget: "markdown", required: false }
